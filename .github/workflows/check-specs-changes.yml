name: Check Lichess API Specs Changes

on:
  schedule:
    # Run daily at 4 AM UTC
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check-specs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout own repo
        uses: actions/checkout@v4

      - name: Get last checked commit
        id: last-commit
        run: |
          if [ -f .last-specs-commit ]; then
            echo "commit=$(cat .last-specs-commit)" >> $GITHUB_OUTPUT
          else
            echo "commit=" >> $GITHUB_OUTPUT
          fi

      - name: Fetch lichess-org/api
        run: |
          git clone --depth 1 https://github.com/lichess-org/api.git /tmp/lichess-api
          cd /tmp/lichess-api
          CURRENT_COMMIT=$(git rev-parse HEAD)
          echo "current_commit=$CURRENT_COMMIT" >> $GITHUB_ENV

      - name: Check for changes in doc/specs
        id: check-changes
        run: |
          LAST_COMMIT="${{ steps.last-commit.outputs.commit }}"
          CURRENT_COMMIT="${{ env.current_commit }}"
          
          if [ -z "$LAST_COMMIT" ]; then
            echo "No previous commit recorded, this is the first run"
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "needs_init=true" >> $GITHUB_OUTPUT
          else
            cd /tmp/lichess-api
            # Fetch history to compare
            git fetch origin master
            git checkout master
            git pull
            
            # Get list of commits that changed doc/specs since last commit
            COMMITS=$(git log --format="%H|%s" "$LAST_COMMIT"..HEAD -- doc/specs/ 2>/dev/null || echo "")
            
            if [ -n "$COMMITS" ]; then
              echo "Changes detected in doc/specs"
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "commits=$COMMITS" >> $GITHUB_OUTPUT
              echo "$COMMITS" > /tmp/specs-commits.txt
            else
              echo "No changes in doc/specs"
              echo "has_changes=false" >> $GITHUB_OUTPUT
            fi
            echo "needs_init=false" >> $GITHUB_OUTPUT
          fi

      - name: Update last checked commit
        if: steps.check-changes.outputs.needs_init == 'true' || steps.check-changes.outputs.has_changes == 'true'
        run: |
          echo "${{ env.current_commit }}" > .last-specs-commit

      - name: Commit updated last commit hash
        if: steps.check-changes.outputs.needs_init == 'true' || steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .last-specs-commit
          git commit -m "Update last checked lichess-api commit: ${{ env.current_commit }}"
          git push

      - name: Upload commits file
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: specs-commits
          path: /tmp/specs-commits.txt

      - name: Create issues for each commit
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const commits = fs.readFileSync('/tmp/specs-commits.txt', 'utf8').trim().split('\n');
            
            // Check for existing issues
            const issues = await github.rest.issues.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            
            const existingIssueTitles = new Set(issues.data.map(issue => issue.title));
            
            for (const commitLine of commits) {
              const [commitHash, commitMessage] = commitLine.split('|');
              const issueTitle = `Spec change: ${commitMessage} (${commitHash.substring(0, 7)})`;
              
              if (!existingIssueTitles.has(issueTitle)) {
                const issueBody = `Lichess API specs have changed in commit: ${commitHash}\n\nCommit message: ${commitMessage}\n\nView commit: https://github.com/lichess-org/api/commit/${commitHash}\n\nPlease review the changes and regenerate the clients if needed.\n\n- Run the openapi-generator workflow\n- Run the oapi-codegen workflow\n- Update the bundled spec if necessary`;
                
                await github.rest.issues.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: issueTitle,
                  body: issueBody,
                  labels: ['spec-change', 'lichess-api']
                });
                console.log(`Created issue for commit: ${commitHash.substring(0, 7)}`);
              } else {
                console.log(`Issue already exists for commit: ${commitHash.substring(0, 7)}`);
              }
            }
