name: Update swagger-codegen client

permissions:
  contents: write

on:
  schedule:
    # Run daily at 4 AM UTC (offset from openapi-generator and oapi-codegen)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if spec version unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  update-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bundle spec and check version
        id: bundle
        uses: ./.github/actions/bundle-spec.yaml

      - name: Check if version changed with force override
        id: check_version
        run: |
          if [ "${{ steps.bundle.outputs.unchanged }}" = "true" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "unchanged=true" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping update"
          else
            echo "unchanged=false" >> $GITHUB_OUTPUT
            echo "Version changed or force override, proceeding with update"
          fi

      - name: Clean swagger-codegen directory
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          if [ -d swagger-codegen ]; then
            find swagger-codegen -mindepth 1 -not -name '.swagger-codegen-ignore' -delete
          fi

      - name: Generate Go client
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          docker run --rm \
            -v "${PWD}:/local" \
            -u $(id -u):$(id -g) \
            swaggerapi/swagger-codegen-cli-v3:latest generate \
            -i /local/lichess-api-bundled.yaml \
            -l go \
            -o /local/swagger-codegen

      - name: Run go mod tidy
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          cd swagger-codegen && go mod tidy

      - name: Update version file
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          echo "${{ steps.bundle.outputs.version }}" > version.txt

      - name: Commit and push changes
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add swagger-codegen
          git diff --staged --quiet || git commit -m "Update swagger-codegen client to Lichess API version ${{ steps.bundle.outputs.version }}"
          git push
