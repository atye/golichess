name: Update openapi-client-generator client

permissions:
  contents: write

on:
  schedule:
    # Run daily at 4 AM UTC (offset from other generators)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if spec version unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  update-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bundle spec and check version
        id: bundle
        uses: ./.github/actions/bundle-spec

      - name: Check if version changed with force override
        id: check_version
        run: |
          if [ "${{ steps.bundle.outputs.unchanged }}" = "true" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "unchanged=true" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping update"
          else
            echo "unchanged=false" >> $GITHUB_OUTPUT
            echo "Version changed or force override, proceeding with update"
          fi

      - name: Install openapi-client-generator
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          go install github.com/parallelworks/openapi-client-generator@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Clean openapi-client-generator directory
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          rm -rf openapi-client-generator/*
          cd openapi-client-generator && go mod init github.com/atye/golichess/openapi-client-generator

      - name: Generate Go client
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          openapi-client-generator generate --spec lichess-api-bundled.yaml --out ./openapi-client-generator

      - name: Run go mod tidy
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          cd openapi-client-generator && go mod tidy

      - name: Update version file
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          echo "${{ steps.bundle.outputs.version }}" > version.txt

      - name: Commit and push changes
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add version.txt openapi-client-generator
          git diff --staged --quiet || git commit -m "Update openapi-client-generator client to Lichess API version ${{ steps.bundle.outputs.version }}"
          git push
