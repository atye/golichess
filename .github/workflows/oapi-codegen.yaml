name: Update oapi-codegen client

permissions:
  contents: write

on:
  schedule:
    # Run daily at 3 AM UTC (offset from openapi-generator)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update even if spec version unchanged'
        required: false
        default: 'false'
        type: choice
        options:
          - true
          - false

jobs:
  update-client:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Bundle spec and check version
        id: bundle
        uses: ./.github/actions/bundle-spec

      - name: Check if version changed with force override
        id: check_version
        run: |
          if [ "${{ steps.bundle.outputs.unchanged }}" = "true" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "unchanged=true" >> $GITHUB_OUTPUT
            echo "Version unchanged, skipping update"
          else
            echo "unchanged=false" >> $GITHUB_OUTPUT
            echo "Version changed or force override, proceeding with update"
          fi

      - name: Install oapi-codegen
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          git clone https://github.com/atye/oapi-codegen.git /tmp/oapi-codegen
          cd /tmp/oapi-codegen
          git checkout feat/kin-openapi-3.1-nulltype
          go install ./cmd/oapi-codegen
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Clean oapi-codegen directory
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          rm -f oapi-codegen/client.gen.go

      - name: Generate Go client
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          oapi-codegen -config oapi-codegen-config.yaml lichess-api-bundled.yaml > oapi-codegen/client.gen.go

      - name: Run go mod tidy
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          cd oapi-codegen && go mod tidy

      - name: Update version file
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          echo "${{ steps.bundle.outputs.version }}" > version.txt

      - name: Commit and push changes
        if: steps.check_version.outputs.unchanged != 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add oapi-codegen
          git diff --staged --quiet || git commit -m "Update oapi-codegen client to Lichess API version ${{ steps.bundle.outputs.version }}"
          git push
